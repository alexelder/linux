%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/toshiba,tc9564-msigen.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC956x MSIGEN Interrupt Controller

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The TC956x MSIGEN (MSI Generator) provides an interrupt controller
  with 25 hardware interrupt lines.  It aggregates internal interrupts
  and generates a single PCIe MSI to the host.

  The MSIGEN requires a clock and reset from the TC956x clock and
  reset controllers.  Function 0 provides MSIGEN at offset 0xf000;
  function 1 provides a separate instance at offset 0xf100.

properties:
  compatible:
    const: toshiba,tc9564-msigen

  reg:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  clocks:
    maxItems: 1
    description: MSIGEN gate clock from the TC956x clock controller

  clock-names:
    const: toshiba,tc9564-msigen-clock

  resets:
    maxItems: 1
    description: MSIGEN reset from the TC956x reset controller

  reset-names:
    const: toshiba,tc9564-msigen-reset

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"
  - clocks
  - clock-names
  - resets
  - reset-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/toshiba,tc9564.h>
    #include <dt-bindings/reset/toshiba,tc9564.h>

    interrupt-controller@f000 {
        compatible = "toshiba,tc9564-msigen";
        reg = <0xf000 0x100>;

        interrupt-controller;
        #interrupt-cells = <1>;

        clocks = <&clock0 CLOCK_MSIGEN>;
        clock-names = "toshiba,tc9564-msigen-clock";
        resets = <&reset0 RESET_MSIGEN>;
        reset-names = "toshiba,tc9564-msigen-reset";
    };
