%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/toshiba,tc9564-translate.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC956x AXI-to-PCIe Address Translation

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The TC956x AXI-to-PCIe address translation unit translates between
  the internal AXI bus address space (above 64 GB, starting at
  0x10_0000_0000) and PCIe bus address space.  The Ethernet MACs
  access the PCIe subsystem via this bus.

  The translation unit has four AXI translation table entries, each
  with eight 4-byte registers.  Currently only the first entry is
  used, mapping the 64 GB AXI address region to PCIe bus address 0x0.

properties:
  compatible:
    const: toshiba,tc9564-translate

  reg:
    maxItems: 1
    description:
      Offset and size of the translation table registers within the
      bridge syscon regmap.

  toshiba,bridge-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      Phandle to the TC956x bridge syscon (compatible
      "toshiba,tc9564-bridge-syscon") plus an offset argument giving
      the base of the translation table registers within the regmap.
    items:
      - items:
          - description: Phandle to the bridge syscon
          - description: Offset of the translation table

required:
  - compatible
  - reg
  - toshiba,bridge-syscon

unevaluatedProperties: false

examples:
  - |
    translate@800 {
        compatible = "toshiba,tc9564-translate";
        reg = <0x0800 0x80>;
        toshiba,bridge-syscon = <&bridge_syscon 0x0800>;
    };
