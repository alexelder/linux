%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/toshiba,tc9564-resets.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC956x Reset Controller

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The TC956x reset controller provides reset controls for internal IP
  blocks including the MCU, MCU1, interrupt controller, UART, MSIGEN,
  and the two Ethernet MACs (MAC, PMA, and XPCS resets each).

  The reset registers are accessed through the parent
  "toshiba,tc9564-config-syscon" syscon regmap.  Two reg entries
  specify the offsets of the reset control registers (RSTCTRL0 and
  RSTCTRL1) within that regmap.

  Reset indices are defined in
  <dt-bindings/reset/toshiba,tc9564.h>.

properties:
  compatible:
    const: toshiba,tc9564-resets

  reg:
    items:
      - description: Offset and size of RSTCTRL0 register
      - description: Offset and size of RSTCTRL1 register

  "#reset-cells":
    const: 1

required:
  - compatible
  - reg
  - "#reset-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/reset/toshiba,tc9564.h>

    reset@1008 {
        compatible = "toshiba,tc9564-resets";
        reg = <0x1008 0x4>, <0x1010 0x4>;
        #reset-cells = <1>;
    };
