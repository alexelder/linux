%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/toshiba,tc9564-clocks.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC956x Clock Controller

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The TC956x clock controller provides gate clocks for internal IP
  blocks including the MCU, SRAM, interrupt controller, UART, MSIGEN,
  PLL, SGMII, and the two Ethernet MACs.

  The clock registers are accessed through the parent
  "toshiba,tc9564-config-syscon" syscon regmap.  Two reg entries
  specify the offsets of the clock control registers (CLKCTRL0 and
  CLKCTRL1) within that regmap.

  Clock indices are defined in
  <dt-bindings/clock/toshiba,tc9564.h>.

properties:
  compatible:
    const: toshiba,tc9564-clocks

  reg:
    items:
      - description: Offset and size of CLKCTRL0 register
      - description: Offset and size of CLKCTRL1 register

  "#clock-cells":
    const: 1

required:
  - compatible
  - reg
  - "#clock-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/toshiba,tc9564.h>

    clock@1004 {
        compatible = "toshiba,tc9564-clocks";
        reg = <0x1004 0x4>, <0x100c 0x4>;
        #clock-cells = <1>;
    };
